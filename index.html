<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Osaka ไปไงดี</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;0,500;0,600;1,700;1,800&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito:ital,wght@0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#fff; --ink:#1d1a4a; --mute:#8580b0; --line:#dcdaf0; --chip:#f4f3fc;
  --soft:#b8b3ff; --pri:#8f8df7; --acc:#ff5fa8;
  --bw:3px; --r:15px; --sh:5px 6px 0 var(--soft);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --font:Nunito,Kanit,"M PLUS Rounded 1c",system-ui,sans-serif;
  --sheet-h:50vh;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{color:var(--ink);background:var(--page);font:500 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left;-webkit-tap-highlight-color:transparent}
#map{position:fixed;inset:0;background:#eeedf8}
.leaflet-container{font:inherit}
.leaflet-control-attribution{font-size:10px}
.leaflet-tile-pane{filter:saturate(.55) brightness(1.04) hue-rotate(8deg)}

/* ---------- floating column (desktop) ---------- */
.ui{position:fixed;top:16px;left:16px;bottom:16px;width:410px;display:flex;flex-direction:column;gap:12px;z-index:1000;pointer-events:none}
.ui>*{pointer-events:auto}

/* search: the one heavy-outlined control, so it reads as "start here" */
.search{position:relative;z-index:2;flex:none;background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);margin-right:6px}
.brand{display:flex;align-items:baseline;gap:8px;padding:10px 14px 0}
.brand b{font:italic 800 21px/1 var(--font);letter-spacing:-.2px}
.brand span{font-size:11.5px;color:var(--mute);font-weight:600}
.row{display:flex;align-items:center;gap:8px;padding:7px 7px 7px 14px;min-height:52px}
.dot{flex:none;width:14px;height:14px;border-radius:50%;border:var(--bw) solid var(--ink);background:var(--acc)}
#q{flex:1;min-width:0;border:0;outline:0;background:none;font-weight:600;font-size:16px;padding:6px 0}
#q::placeholder{color:var(--mute);font-weight:500}
#clear{flex:none;width:30px;height:30px;border-radius:50%;background:var(--chip);text-align:center;font-weight:800;color:var(--mute);display:none}
.search.has-q #clear{display:block}

/* compact pill around a native <select>: phones get their own picker */
.sel{position:relative;flex:none;display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 10px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:700;min-width:0}
.sel svg{flex:none;width:16px;height:16px}
.sel select{appearance:none;-webkit-appearance:none;min-width:0;max-width:100%;border:0;outline:0;background:none;padding:0 15px 0 0;font-weight:700;font-size:inherit;cursor:pointer;text-overflow:ellipsis}
.sel::after{content:"▾";position:absolute;right:10px;font-size:11px;color:var(--mute);pointer-events:none}
.sel:focus-within{box-shadow:0 0 0 2px var(--pri)}

.menu{position:absolute;left:-3px;right:-3px;top:calc(100% + 10px);margin:0;padding:6px;list-style:none;background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);max-height:min(360px,55vh);overflow:auto;display:none;transform-origin:top center}
.menu.open{display:block;animation:pop .28s var(--spring)}
.menu li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer}
.menu li:hover{background:var(--chip)}
.menu li em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--mute);font-weight:600;white-space:nowrap}
.menu li .sub{display:block;font-size:12px;color:var(--mute)}
.menu .empty{color:var(--mute);cursor:default}

/* panel */
.panel{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(29,26,74,.13);margin-right:6px}
.grab{display:none}
.pbody{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom)}
.panel h2{font-size:15px;font-weight:700;margin:0}
.sec{padding:14px 16px}
.sec+.sec{border-top:1px solid var(--line)}
.sec.list{padding:6px 8px}

/* sticky sheet header: origin, filters, place title */
.shead{position:sticky;top:0;z-index:2;background:#fff;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.from{display:flex;align-items:center;gap:8px;min-width:0;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--mute)}
.shead>.from:first-child{margin-top:0}
.from .sel{flex:0 1 auto;background:#fff;border:2px solid var(--ink);color:var(--ink)}
.from .dist{margin-left:auto;white-space:nowrap;font-weight:600}
.phead{display:flex;align-items:center;gap:10px}
.back{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:24px;font-weight:800;line-height:1;padding-bottom:3px;transition:transform .25s var(--spring),background .15s}
.back:hover{background:var(--chip)}
.back:active{transform:scale(.9)}
.pt{min-width:0}
.title{font:italic 800 22px/1.2 var(--font);letter-spacing:-.2px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.names{color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc{font-size:13.5px;margin:0}

/* category pills */
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;font-weight:600;white-space:nowrap;transition:transform .25s var(--spring),background .15s}
.pill:hover{background:var(--chip)}
.pill:active{transform:scale(.92)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--c);border:1.5px solid var(--ink)}
.pill.on i{border-color:#fff}

.place{display:flex;align-items:center;gap:12px;width:100%;padding:10px 8px;border-radius:12px;transition:transform .25s var(--spring),background .15s}
.place:hover{background:var(--chip)}
.place:active{transform:scale(.97)}
.place>span:nth-child(2){min-width:0}
.bub{flex:none;width:36px;height:36px;border-radius:50%;background:var(--c);border:2.5px solid var(--ink);display:grid;place-items:center}
.bub svg{width:18px;height:18px}
.place .nm{font-weight:700;line-height:1.25}
.place .sb{font-size:12px;color:var(--mute)}
.place .rt{margin-left:auto;text-align:right;white-space:nowrap}
.place .rt b{display:block;font-weight:800}
.place .rt span{font-size:11.5px;color:var(--mute)}

/* route cards */
.route{display:block;width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;margin-top:10px;transition:transform .3s var(--spring),box-shadow .2s,border-color .2s}
.route:first-of-type{margin-top:12px}
.route.open{border:var(--bw) solid var(--ink);box-shadow:var(--sh);margin-bottom:16px}
.route-head{display:block;width:100%;padding:12px 14px}
.route-head:active{transform:scale(.98)}
.r1{display:flex;align-items:center;gap:8px;min-width:0}
.mode{flex:none;width:30px;height:30px;border-radius:9px;background:var(--chip);display:grid;place-items:center}
.route.open .mode{background:var(--soft)}
.mode svg{width:18px;height:18px}
.r1 .ttl{min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{flex:none;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--acc);color:#fff;transform:rotate(-3deg)}
.r1 .time{flex:none;margin-left:auto;font:italic 800 19px/1 var(--font);white-space:nowrap}
.r1 .time small{font:600 12px var(--font);color:var(--mute);font-style:normal}
.r2{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--mute);font-weight:600}
.r2 .price{color:var(--ink);font-weight:800}
.r2 .sep{opacity:.5}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:7px;background:var(--c);color:#fff;font-size:11.5px;font-weight:800;border:2px solid var(--ink);line-height:1}
.chain{display:inline-flex;align-items:center;gap:4px}
.chain i{font-style:normal;color:var(--mute)}
.pass{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.pass.no{color:var(--mute);background:#fff}

.steps{padding:4px 14px 12px;border-top:1px solid var(--line);animation:drop .3s var(--spring)}
.step{display:grid;grid-template-columns:26px 1fr;gap:10px}
.step .lane{display:flex;flex-direction:column;align-items:center;padding-top:12px}
.step .node{flex:none;width:16px;height:16px;border-radius:50%;background:#fff;border:var(--bw) solid var(--ink)}
.step .bar{flex:1;width:6px;margin:3px 0 -9px;border-radius:3px;background:var(--c)}
.step.walk .bar,.step.taxi .bar{background:repeating-linear-gradient(var(--mute) 0 5px,transparent 5px 10px)}
.step .body{padding:9px 0 9px;min-width:0}
.step .hd{font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.step .meta{font-size:12.5px;color:var(--mute)}
.step .tip{display:inline-block;margin-top:5px;font-size:12.5px;background:var(--chip);border-radius:9px;padding:5px 9px}
.step.end .lane .node{background:var(--acc)}
.step.end .body{padding-bottom:2px}
.note{margin:12px 0 0;font-size:12px;color:var(--mute)}

/* map pins */
.pin{position:relative;width:36px;height:36px;border-radius:50%;background:var(--c);border:var(--bw) solid var(--ink);box-shadow:3px 4px 0 var(--soft);display:grid;place-items:center;transition:transform .3s var(--spring)}
.pin svg{width:18px;height:18px}
.pin:hover{transform:scale(1.15) rotate(-4deg)}
.pin.sel{transform:scale(1.25);box-shadow:4px 5px 0 var(--ink);animation:squash .45s var(--spring)}
.pin.dim{opacity:.28}
.pin span{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:1px 7px;font-size:12px;font-weight:700;display:none;pointer-events:none}
.pin:hover span,.pin.sel span{display:block}
.here{position:relative;width:22px;height:22px;border-radius:50%;background:var(--ink);border:4px solid #fff;box-shadow:0 0 0 3px var(--ink)}
.here::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:3px solid var(--pri);animation:ping 1.8s ease-out infinite}
.here span{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) rotate(-3deg);white-space:nowrap;background:var(--ink);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
.stn{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.leaflet-tooltip.stn-tip{background:#fff;border:2px solid var(--ink);border-radius:8px;color:var(--ink);font:700 11.5px var(--font);padding:1px 6px;box-shadow:none}
.leaflet-tooltip.stn-tip::before{display:none}

@keyframes pop{from{transform:scale(.9) translateY(-8px);opacity:0}}
@keyframes drop{from{transform:translateY(-8px);opacity:0}}
@keyframes squash{0%{transform:scale(.7,1.3)}45%{transform:scale(1.4,1.1)}100%{transform:scale(1.25)}}
@keyframes ping{from{transform:scale(.5);opacity:1}to{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- impact-frame effects ---------- */
#fx{position:fixed;inset:0;z-index:3000;pointer-events:none;overflow:hidden}
.fx-burst{position:absolute;transform:translate(-50%,-50%)}
.fx-burst svg{position:absolute;inset:0;overflow:visible}
.fx-burst .star{fill:var(--soft);stroke:var(--ink);stroke-width:2;stroke-linejoin:round;transform-box:fill-box;transform-origin:center;animation:fxStar .45s var(--spring) forwards}
.fx-burst .speed{stroke:var(--acc);stroke-width:2;stroke-linecap:round;animation:fxFade .45s ease-out .05s forwards;opacity:0}
.fx-burst .puff{position:absolute;left:50%;top:50%;width:13px;height:13px;margin:-6.5px;border-radius:50%;background:#fff;border:2px solid var(--ink);box-shadow:inset -2px -2px 0 var(--chip);animation:fxPuff .6s cubic-bezier(.2,.8,.3,1) forwards}
.fx-burst .shard{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;background:var(--pri);border:1.5px solid var(--ink);animation:fxShard .55s cubic-bezier(.2,.8,.3,1) forwards}
.fx-burst .sfx{position:absolute;left:50%;top:-6%;font:italic 800 calc(13px + 5px*var(--k)) / 1 "M PLUS Rounded 1c",var(--font);color:var(--ink);-webkit-text-stroke:4px #fff;paint-order:stroke fill;filter:drop-shadow(2px 2px 0 var(--acc));white-space:nowrap;animation:fxWord .7s var(--spring) forwards}
@keyframes fxStar{0%{transform:scale(.15) rotate(-10deg);opacity:1}55%{transform:scale(1) rotate(3deg);opacity:1}100%{transform:scale(1.15) rotate(6deg);opacity:0}}
@keyframes fxFade{0%{opacity:1}100%{opacity:0}}
@keyframes fxPuff{0%{transform:translate(0,0) scale(.2);opacity:1}45%{transform:translate(calc(var(--dx)*.8),calc(var(--dy)*.8)) scale(var(--s));opacity:1}75%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(calc(var(--s)*.35));opacity:0}}
@keyframes fxShard{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.9);opacity:0}}
@keyframes fxWord{0%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(.2);opacity:0}30%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(1.18);opacity:1}55%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-85%) rotate(var(--rot)) scale(1);opacity:0}}

/* ---------- photo guides inside a walking step ---------- */
.shots{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:8px -14px 0 -2px;padding:4px 14px 8px 2px;scrollbar-width:none;overscroll-behavior-x:contain}
.shots::-webkit-scrollbar{display:none}
.shot{flex:none;width:96px;scroll-snap-align:start;display:flex;flex-direction:column;gap:6px}
.shot .ph{position:relative;display:block;width:96px;height:128px;border-radius:12px;border:2.5px solid var(--ink);box-shadow:3px 4px 0 var(--soft);overflow:hidden;background:var(--chip);transition:box-shadow .2s}
.shot:hover .ph{box-shadow:3px 4px 0 var(--acc)}
.shot .ph svg,.shot .ph img,.pic svg,.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.num{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:800;line-height:1}
.shot .num{position:absolute;left:6px;top:6px}
.stop{position:absolute;right:6px;top:6px;padding:2px 7px;border-radius:999px;background:var(--acc);color:#fff;font-size:10.5px;font-weight:800;transform:rotate(4deg);border:2px solid var(--ink)}
.shot .cap{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:11.5px;font-weight:600;line-height:1.3;color:var(--ink)}
.step .meta .cam{display:inline-flex;align-items:center;gap:3px;margin-left:6px;padding:0 7px;border-radius:999px;background:var(--chip);color:var(--ink);font-weight:700}

/* ---------- full-screen photo viewer ---------- */
.viewer{position:fixed;inset:0;z-index:2500;display:flex;flex-direction:column;background:rgba(29,26,74,.95);color:#fff;animation:vIn .22s ease-out}
.viewer[hidden]{display:none}
.vtop{flex:none;display:flex;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top)) 12px 6px 16px}
.vtitle{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcount{flex:none;font-weight:800;font-size:13px;background:#fff;color:var(--ink);border-radius:999px;padding:3px 10px}
.vbtn{flex:none;width:44px;height:44px;border-radius:50%;background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:3px 4px 0 var(--acc);display:grid;place-items:center;font-size:24px;font-weight:800;line-height:1;padding-bottom:2px}
.vbtn:disabled{opacity:.3;box-shadow:none}
.vtrack{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain}
.vtrack::-webkit-scrollbar{display:none}
.slide{flex:none;width:100%;margin:0;scroll-snap-align:center;scroll-snap-stop:always;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:6px 18px}
.pic{position:relative;width:min(100%,420px,calc((100dvh - 290px)*.75));aspect-ratio:3/4;border-radius:16px;border:3px solid #fff;box-shadow:6px 7px 0 var(--acc);overflow:hidden;background:var(--chip)}
.pic .stop{top:10px;right:10px;font-size:12px}
.vcap{width:min(100%,420px);display:flex;gap:10px;align-items:flex-start;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;box-shadow:4px 5px 0 var(--soft)}
.vcap .num{flex:none;margin-top:1px}
.vcap b{display:block;font-weight:700;line-height:1.35}
.vcap small{display:block;margin-top:3px;font-size:11.5px;color:var(--mute);font-weight:600}
.vnav{flex:none;display:flex;align-items:center;justify-content:center;gap:16px;padding:8px 16px max(16px,env(safe-area-inset-bottom))}
.vdots{display:flex;gap:6px}
.vdots i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.35);transition:width .3s var(--spring),background .2s}
.vdots i.on{width:22px;background:#fff}
@keyframes vIn{from{opacity:0}}

/* ---------- phone: one-line search on top, draggable bottom sheet ---------- */
@media (max-width:720px){
  .ui{top:10px;left:10px;right:10px;bottom:auto;width:auto;gap:0}
  .search{margin:0;box-shadow:3px 4px 0 var(--soft)}
  .brand{display:none}
  .row{min-height:50px;padding:6px 6px 6px 14px}
  .panel{position:fixed;left:0;right:0;bottom:0;height:var(--sheet-h);margin:0;border:0;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(29,26,74,.16);transition:height .38s var(--spring)}
  .panel.dragging{transition:none}
  .grab{display:block;flex:none;height:24px;position:relative;cursor:grab;touch-action:none}
  .grab::before{content:"";position:absolute;left:50%;top:9px;width:42px;height:5px;margin-left:-21px;border-radius:3px;background:var(--line)}
  .shead{padding:0 16px 12px}
  .shead,.shead *{touch-action:pan-x}
  .title{font-size:20px}
  .desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .route .passes{display:none}
  .route.open .passes{display:flex}
  .leaflet-control-zoom{display:none}
  .leaflet-bottom{bottom:var(--sheet-h);transition:bottom .38s var(--spring)}
}
</style>
</head>
<body>
<div id="map"></div>

<div class="ui">
  <div class="search" id="search">
    <div class="brand"><b id="brand"></b><span id="tagline"></span></div>
    <div class="row">
      <span class="dot"></span>
      <input id="q" autocomplete="off" enterkeyhint="search">
      <button id="clear" type="button">×</button>
      <label class="sel" title="Language">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1d1a4a" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.2 3.6 8.5s-1.2 6.2-3.6 8.5c-2.4-2.3-3.6-5.2-3.6-8.5S9.6 5.8 12 3.5z"/></svg>
        <select id="lang" aria-label="Language"><option value="th">ไทย</option><option value="en">EN</option><option value="ja">日本語</option></select>
      </label>
    </div>
    <ul class="menu" id="suggest"></ul>
  </div>
  <aside class="panel" id="panel">
    <div class="grab" aria-hidden="true"></div>
    <div class="pbody" id="pbody"></div>
  </aside>
</div>
<div id="fx" aria-hidden="true"></div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" hidden>
  <div class="vtop"><div class="vtitle" id="vTitle"></div><span class="vcount" id="vCount"></span><button class="vbtn" id="vClose">×</button></div>
  <div class="vtrack" id="vTrack"></div>
  <div class="vnav"><button class="vbtn" id="vPrev">‹</button><div class="vdots" id="vDots"></div><button class="vbtn" id="vNext">›</button></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

/* ================= ROUTING ================= */
// Steps keep ids and translatable values; text is resolved when rendering, so switching language needs no recompute.
const hav = (a,b) => { const R=6371,r=Math.PI/180,dLa=(b[0]-a[0])*r,dLo=(b[1]-a[1])*r;
  const h=Math.sin(dLa/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
const segKm = path => path.slice(1).reduce((s,p,i) => s + hav(path[i],p), 0) * 1.1;

// Build the network graph once
const ADJ = {};
const addEdge = (a,e) => (ADJ[a] = ADJ[a] || []).push(e);
for(const [id,ln] of Object.entries(LINES)){
  const N = ln.st.length, segs = ln.loop ? N : N-1;
  for(let i=0;i<segs;i++){
    const a = ln.st[i], b = ln.st[(i+1)%N], via = (ln.via && ln.via[i]) || [], n = ln.n ? ln.n[i] : 1;
    const path = [ST[a].ll, ...via, ST[b].ll], dkm = ln.km ? ln.km[i] : segKm(path);
    addEdge(a, {to:b, line:id, min:ln.min[i], n, km:dkm, dir:1, path});
    addEdge(b, {to:a, line:id, min:ln.min[i], n, km:dkm, dir:0, path:[...path].reverse()});
  }
}
WALKS.forEach(([a,b,m]) => {
  addEdge(a, {to:b, walk:true, min:m, path:[ST[a].ll, ST[b].ll]});
  addEdge(b, {to:a, walk:true, min:m, path:[ST[b].ll, ST[a].ll]});
});

// Shortest-time route over the network (Dijkstra on station+line states). ban = lines to avoid.
function railRoute(origin, place, ban = {}){
  const dist = {}, prev = {}, done = {}, open = [], key = (s,l) => s + '|' + l;
  origin.access.forEach(([s,m,tip]) => { const k = key(s,'start'); dist[k] = m; prev[k] = {start:true, s, m, tip}; open.push(k); });
  const goal = {}; place.access.forEach(a => goal[a[0]] = a);
  const fromSt = {}; origin.access.forEach(a => fromSt[a[0]] = 1);   // stations you can already walk to are not a ride
  const opOf = l => LINES[l] && LINES[l].op;
  let best = null;
  while(open.length){
    let bi = 0; for(let i=1;i<open.length;i++) if(dist[open[i]] < dist[open[bi]]) bi = i;
    const k = open.splice(bi,1)[0]; if(done[k]) continue; done[k] = 1;
    if(best && dist[k] >= best.tot) break;
    const [s,l] = k.split('|');
    if(goal[s] && !fromSt[s] && l !== 'start' && l !== 'walk'){ const tot = dist[k] + goal[s][1]; if(!best || tot < best.tot) best = {k, tot, acc:goal[s]}; }
    for(const e of ADJ[s] || []){
      let nk, c;
      if(e.walk){ if(l === 'walk' || l === 'start') continue; nk = key(e.to,'walk'); c = dist[k] + e.min; }
      else { if(ban[e.line]) continue; nk = key(e.to,e.line);
        // boarding 2-3 min, same-operator transfer 4, changing operator (exit gates, new ticket) 7
        c = dist[k] + e.min + (l === e.line ? 0 : l === 'start' ? 2 : l === 'walk' ? 3 : opOf(l) === opOf(e.line) ? 4 : 7); }
      if(dist[nk] === undefined || c < dist[nk]){ dist[nk] = c; prev[nk] = {from:k, e}; open.push(nk); }
    }
  }
  if(!best) return null;

  const edges = []; let k = best.k, p;
  while(!(p = prev[k]).start){ edges.unshift(p.e); k = p.from; }
  const steps = []; let cur = p.s;
  if(p.m > 0) steps.push({t:'walk', kind:'to', st:p.s, min:p.m, path:[origin.ll, ST[p.s].ll], tip:p.tip});
  for(const e of edges){
    const last = steps[steps.length-1];
    if(e.walk) steps.push({t:'walk', kind:'transfer', from:cur, st:e.to, min:e.min, path:e.path});
    else if(last && last.t === 'ride' && last.line === e.line){
      last.to = e.to; last.min += e.min; last.km += e.km; last.path.push(...e.path.slice(1));
      last.stops = (last.stops == null || e.n == null) ? null : last.stops + e.n;
    } else steps.push({t:'ride', line:e.line, from:cur, to:e.to, stops:e.n, min:e.min, km:e.km, dir:e.dir, path:[...e.path]});
    cur = e.to;
  }
  steps.push({t:'walk', kind:'last', text:best.acc[2], place, st:cur, min:best.acc[1], path:[ST[cur].ll, place.ll]});

  // fare: consecutive rides on the same operator share one ticket
  const rides = steps.filter(s => s.t === 'ride'); let yen = 0, i = 0;
  if(rides.some(s => s.from === s.to)) return null;   // out-and-back detour, not a real route
  while(i < rides.length){ const op = LINES[rides[i].line].op; let kmSum = 0, air = false;
    while(i < rides.length && LINES[rides[i].line].op === op){ const r = rides[i++]; kmSum += r.km;
      air = air || r.from === 'kix' || r.to === 'kix'; }
    yen += FARE[op](kmSum, air); }
  const ops = [...new Set(rides.map(s => LINES[s.line].op))];
  return {mode: ops.includes('bus') ? 'bus' : 'train', ops, min: Math.round(best.tot), yen, steps, lines: rides.map(s => s.line),
    pass: ops.every(o => o === 'metro' || o === 'bus') ? PASS.metro : PASS.none};
}

// All the ways to get from the current origin to a place
const memo = {};
function routesFor(p){
  const mk = ORIGIN.id + '>' + p.id; if(memo[mk]) return memo[mk];
  const d = hav(ORIGIN.ll, p.ll), seen = {}; let out = [];
  const push = r => { const sig = r.steps.filter(s => s.t === 'ride').map(s => LINES[s.line].op + s.from + s.to).join('>');
    if(!seen[sig]){ seen[sig] = 1; out.push(r); } };
  const nTransfer = r => r.lines.length - 1;
  const best = railRoute(ORIGIN, p);
  if(best){
    push(best);
    // alternatives: avoid each line of the best route, then each whole operator
    const bans = best.lines.map(l => ({[l]:1}));
    new Set(best.lines.map(l => LINES[l].op)).forEach(op =>
      bans.push(Object.fromEntries(Object.keys(LINES).filter(l => LINES[l].op === op).map(l => [l,1]))));
    // ...and single-operator options (one ticket, pass-friendly)
    ['metro','jr','nankai'].forEach(op =>
      bans.push(Object.fromEntries(Object.keys(LINES).filter(l => LINES[l].op !== op).map(l => [l,1]))));
    bans.map(b => railRoute(ORIGIN, p, b)).filter(a => a && a.min <= best.min*1.4 + 8).forEach(push);
    // recommend by time, with a small penalty per transfer and per ¥100, so a near-tie goes to the simpler route
    const score = r => r.min + 3*nTransfer(r) + r.yen/100;
    out.sort((a,b) => score(a) - score(b));
    const direct = out.find(r => r.mode === 'bus' && r.lines.length === 1);   // always keep a direct bus as an option
    out = out.slice(0, 3); if(direct && !out.includes(direct)) out[out.length - 1] = direct;
    out.forEach((r,i) => r.tag = i === 0 ? 'rec' : r.min < out[0].min ? 'faster'
      : nTransfer(r) === 0 && nTransfer(out[0]) > 0 ? 'direct' : r.yen < out[0].yen ? 'cheaper' : null);
  }
  const top = out[0];
  if(d <= 2.6){
    const wk = +(d*1.25).toFixed(1), wmin = Math.max(1, Math.round(d*15));
    const w = {mode:'walk', min:wmin, yen:0, km:wk, steps:[{t:'walk', kind:'direct', place:p, km:wk, min:wmin, path:[ORIGIN.ll, p.ll]}]};
    if(w.min <= 12){ w.tag = 'near'; out = [w]; }          // too close to bother riding
    else if(!top || w.min <= top.min){ w.tag = 'rec'; if(top) top.tag = null; out.unshift(w); }
    else out.push(w);
  }
  if(d > 0.8 && d <= 20){
    // Osaka upper-limit taxi fare since Nov 2025: ¥600 for the first 1.2 km, +¥100 per 231 m; +10% for slow traffic
    const road = d*1.35, min = Math.round(road*3 + 4);
    out.push({mode:'taxi', min, yenText:'~¥' + (Math.round((600 + Math.ceil(Math.max(0, road - 1.2)/0.231)*100)*1.1/100)*100).toLocaleString('en-US'),
      steps:[{t:'taxi', min, path:[ORIGIN.ll, p.ll]}]});
  }
  return memo[mk] = out;
}
const routeTitle = r => r.mode === 'walk' ? t('tWalk') : r.mode === 'taxi' ? t('tTaxi')
  : r.ops.length > 1 ? r.ops.map(o => tr(OP[o])).join(' + ')
  : r.ops[0] === 'bus' ? t('tBus') : r.ops[0] === 'metro' ? t('tMetro') : t('tRail', tr(OP[r.ops[0]]));

/* ================= FX: anime impact frames ================= */
// Starburst + speed lines + smoke puffs + shards + manga lettering, drawn on a fixed overlay so it survives re-renders.
const calm = matchMedia('(prefers-reduced-motion: reduce)');
const rnd = (a, b) => a + Math.random() * (b - a);
function burst(target, {word, size = 1} = {}){
  if(calm.matches || !target) return;
  const r = target.getBoundingClientRect ? target.getBoundingClientRect() : target;
  const x = r.left + (r.width || 0) / 2, y = r.top + (r.height || 0) / 2;
  const S = Math.round(96 * size), c = S / 2, n = 10, pts = [];
  for(let i = 0; i < n * 2; i++){
    const a = i / (n * 2) * Math.PI * 2 + rnd(-.09, .09), rad = (i % 2 ? rnd(.3, .38) : rnd(.6, .95)) * c;
    pts.push((c + Math.cos(a) * rad).toFixed(1) + ',' + (c + Math.sin(a) * rad).toFixed(1));
  }
  const speed = Array.from({length:6}, (_, i) => {
    const a = i / 6 * Math.PI * 2 + rnd(-.2, .2), r1 = c * 1.02, r2 = c * rnd(1.18, 1.32);
    return `<line x1="${(c + Math.cos(a) * r1).toFixed(1)}" y1="${(c + Math.sin(a) * r1).toFixed(1)}" x2="${(c + Math.cos(a) * r2).toFixed(1)}" y2="${(c + Math.sin(a) * r2).toFixed(1)}"/>`;
  }).join('');
  const el = document.createElement('div');
  el.className = 'fx-burst';
  el.style.cssText = `left:${x}px;top:${y}px;width:${S}px;height:${S}px;--k:${size}`;
  el.innerHTML = `<svg viewBox="0 0 ${S} ${S}"><g class="speed">${speed}</g><polygon class="star" points="${pts.join(' ')}"/></svg>`;
  for(let i = 0; i < 3; i++){
    const a = rnd(0, Math.PI * 2), d = c * rnd(.7, 1.05), p = document.createElement('i');
    p.className = 'puff';
    p.style.cssText = `--dx:${(Math.cos(a) * d).toFixed(1)}px;--dy:${(Math.sin(a) * d).toFixed(1)}px;--s:${(rnd(.55, 1) * Math.max(.6, size)).toFixed(2)}`;
    el.appendChild(p);
  }
  for(let i = 0; i < 2; i++){
    const a = rnd(0, Math.PI * 2), d = c * rnd(1.1, 1.5), s = document.createElement('i');
    s.className = 'shard';
    s.style.cssText = `--dx:${(Math.cos(a) * d).toFixed(1)}px;--dy:${(Math.sin(a) * d).toFixed(1)}px;--r:${Math.round(rnd(90, 320))}deg`;
    el.appendChild(s);
  }
  if(word){
    const w = document.createElement('b');
    w.className = 'sfx'; w.textContent = word; w.style.setProperty('--rot', rnd(-14, -6).toFixed(1) + 'deg');
    el.appendChild(w);
  }
  $('fx').appendChild(el);
  setTimeout(() => el.remove(), 750);
  if(word && navigator.vibrate) try { navigator.vibrate(8); } catch(e){}
}
// squash-and-stretch on press, like a cel drawn on the beat
function squash(el){
  if(calm.matches || !el || !el.animate) return;

    {duration:320, easing:'cubic-bezier(.34,1.56,.64,1)'});
}

function arrowSvg(a, x = 60, y = 128){

const VIEW = {key:null, i:0};
function openViewer(key, i, title){

}
function syncViewer(){
  const tr_ = $('vTrack'), n = GUIDES[VIEW.key].length;
  VIEW.i = Math.max(0, Math.min(n - 1, Math.round(tr_.scrollLeft / Math.max(1, tr_.clientWidth))));
  $('vCount').textContent = `${VIEW.i + 1} / ${n}`;
  [...$('vDots').children].forEach((d, k) => d.classList.toggle('on', k === VIEW.i));
  $('vPrev').disabled = VIEW.i === 0; $('vNext').disabled = VIEW.i === n - 1;
}
function goViewer(d){ const tr_ = $('vTrack'); tr_.scrollTo({left:(VIEW.i + d) * tr_.clientWidth, behavior:calm.matches ? 'auto' : 'smooth'}); }
function hideViewer(){ $('viewer').hidden = true; VIEW.key = null; }

addEventListener('popstate', () => { if(VIEW.key) hideViewer(); });

$('vClose').addEventListener('click', closeViewer);
$('vPrev').addEventListener('click', () => goViewer(-1));

function drawRoute(fit = true){
  routeLayer.clearLayers();
  if(!state.place){ return; }
  const r = routesFor(byId(state.place))[state.route], pts = [];
  r.steps.forEach(s => {
    if(!s.path) return;
    pts.push(...s.path);
    const soft = s.t !== 'ride';
    L.polyline(s.path, {color:'#1d1a4a', weight: soft ? 0 : 10, lineCap:'round'}).addTo(routeLayer);
    L.polyline(s.path, {color: soft ? '#1d1a4a' : LINES[s.line].color, weight: soft ? 4 : 6,
      dashArray: soft ? '2 9' : null, lineCap:'round'}).addTo(routeLayer);
    if(s.t === 'ride'){
      [[s.path[0], s.from], [s.path[s.path.length-1], s.to]].forEach(([ll,id]) =>
        L.marker(ll, {icon:L.divIcon({className:'', html:'<div class="stn"></div>', iconSize:[14,14], iconAnchor:[7,7]}), interactive:false})
          .bindTooltip(sn(id), {permanent:true, direction:'top', offset:[0,-6], className:'stn-tip'}).addTo(routeLayer));
    }
  });
  if(!fit) return;
  map.invalidateSize();
  map.fitBounds(L.latLngBounds(pts), {...pad(), maxZoom:16});
}

    return;
  }
  const p = byId(state.place), rs = routesFor(p);
  el.innerHTML = `<div class="shead">
      <div class="phead">
        <button class="back" data-back aria-label="${t('back').replace('‹','').trim()}">‹</button>
        <div class="pt"><h1 class="title">${pn(p)}</h1><div class="names">${pSub(p)}</div></div>
      </div>
      <div class="from"><span>${t('origin')}</span>${originSelect()}<span class="dist">${t('away', km(ORIGIN.ll,p.ll).toFixed(1))}</span></div>
    </div>
    <div class="sec"><p class="desc">${tr(p.desc)}</p></div>
    <div class="sec">
      <h2>${t('howTitle')} <span style="color:var(--mute);font-weight:600">${t('ways', rs.length)}</span></h2>
      ${rs.map((r,i) => routeCard(r,i,p)).join('')}
      <p class="note">${t('note')}</p>
    </div>`;
  el.scrollTop = 0;
}

function routeCard(r, i, p){
  const open = i === state.route;
  const rides = r.steps.filter(s => s.t==='ride');
  const chain = rides.length ? `<span class="chain">${rides.map(s => badge(s.line)).join('<i>›</i>')}</span><span class="sep">·</span>` : '';
  const bits = [`<span class="price">${price(r)}</span>`];
  if(rides.length) bits.push(transfers(r) ? t('transfersN', transfers(r)) : t('noTransfer'), t('walkTotal', walkMin(r)));
  if(r.km) bits.push(`${r.km} ${t('km')}`);
  const pass = r.pass ? (r.pass.length ? r.pass.map(x => `<span class="pass">✓ ${tr(x)}</span>`).join('')
                                       : `<span class="pass no">${t('ecoNo')}</span>`) : '';
  return `<div class="route ${open?'open':''}">
    <button class="route-head" data-route="${i}" aria-expanded="${open}">
      <div class="r1"><span class="mode">${svg(r.mode)}</span><span class="ttl">${routeTitle(r)}</span>
        ${r.tag?`<span class="tag">${t('tag')[r.tag]}</span>`:''}<span class="time">${r.min} <small>${t('min')}</small></span></div>
      <div class="r2">${chain}${bits.join('<span class="sep">·</span>')}</div>
      ${pass?`<div class="r2 passes">${pass}</div>`:''}
    </button>
    ${open ? `<div class="steps">${r.steps.map(stepRow).join('')}
      <div class="step end"><div class="lane"><span class="node"></span></div>
        <div class="body"><div class="hd">${t('arrive', pn(p))}</div></div></div></div>` : ''}
  </div>`;
}

function stepRow(s){
  if(s.t === 'ride'){
    const ln = LINES[s.line], end = tr(ln.ends[s.dir]);
    const dir = (ln.rawDir ? end : t('toward', end)) + (ln.tip ? ' · ' + tr(ln.tip) : '');
    return `<div class="step ride" style="--c:${ln.color}"><div class="lane"><span class="node"></span><span class="bar"></span></div>
      <div class="body"><div class="hd">${badge(s.line)} ${tr(ln.name)}</div>
        <div class="meta">${sn(s.from)} → <b style="color:var(--ink)">${sn(s.to)}</b> · ${s.stops ? t('stops', s.stops) + ' · ' : ''}${s.min} ${t('min')}</div>
        <span class="tip">${dir}</span></div></div>`;
  }
  const on = tr(ORIGIN.name);
  const text = s.t === 'taxi' ? t('taxiFrom', on)
    : s.kind === 'to' ? t('walkTo', stName(s.st))
    : s.kind === 'transfer' ? t('walkTransfer', stName(s.st))
    : s.kind === 'direct' ? t('walkFrom', on, s.km)
    : tr(s.text) || t('walkTo', pn(s.place));
  const tip = s.t === 'taxi' ? t('taxiTip') : tr(s.tip);
  const key = s.t === 'walk' ? guideKey(s) : null, shots = key && GUIDES[key];
  return `<div class="step ${s.t}"><div class="lane"><span class="node"></span><span class="bar"></span></div>
    <div class="body"><div class="hd">${text}</div><div class="meta">${t(s.t==='taxi' ? 'rideFor' : 'walkFor', s.min)}${shots ? `<span class="cam">📷 ${t('photos', shots.length)}</span>` : ''}</div>
      ${tip?`<span class="tip">${tip}</span>`:''}${shots ? shotsHtml(key) : ''}</div></div>`;
}

/* ================= ACTIONS ================= */
function selectPlace(id){
  state.place = id; state.route = 0;
  $('q').value = pn(byId(id)); $('search').classList.add('has-q');
  closeMenus(); if(isMobile()) setSheet('half');
  syncMarkers(); renderPanel(); drawRoute();
}
function clearPlace(){
  state.place = null; $('q').value = ''; $('search').classList.remove('has-q');
  if(isMobile()) setSheet('half');
  syncMarkers(); renderPanel(); drawRoute(); fitAll();
}
function fitAll(){
  const ps = PLACES.filter(p => state.cat==='all' || p.cat===state.cat).map(p => p.ll);
  map.invalidateSize();
  const far = ps.every(ll => hav(ORIGIN.ll, ll) > 15);
  map.fitBounds(L.latLngBounds(far ? ps : [ORIGIN.ll, ...ps]), {...pad(), maxZoom:15});
}
function closeMenus(){ $('suggest').classList.remove('open'); }
function suggest(){
  const q = $('q').value.trim().toLowerCase();
  const hits = PLACES.filter(p => !q || [p.name.th, p.name.en, p.name.ja, p.alias || ''].some(n => n.toLowerCase().includes(q)));
  $('suggest').innerHTML = hits.length ? hits.map(p => `<li data-place="${p.id}">
      <span class="bub" style="--c:${CATS[p.cat].color};width:30px;height:30px">${svg(CATS[p.cat].icon)}</span>
      <span>${pn(p)}<span class="sub">${pSub(p)}</span></span><em>${tr(CATS[p.cat].name)}</em></li>`).join('')
    : `<li class="empty">${t('noPlace')}</li>`;
  $('suggest').classList.add('open');
}
function setOrigin(id){
  ORIGIN = ORIGINS.find(o => o.id === id); state.route = 0;
  hereMarker.setLatLng(ORIGIN.ll);
  renderPanel();
  if(state.place) drawRoute(); else fitAll();
}
function setLang(l){
  LANG = l; try { localStorage.setItem('osaka-lang', l); } catch(e){}
  renderAll();
}
// Re-render every piece of text in the current language, keeping the map view and open route as they are
function renderAll(){
  renderStatic(); syncMarkers();
  hereMarker.setIcon(hereIcon());
  if(state.place) $('q').value = pn(byId(state.place));
  const top = $('pbody').scrollTop; renderPanel(); $('pbody').scrollTop = top;
  drawRoute(false);
}

$('q').addEventListener('focus', () => { $('q').select(); suggest(); });
$('q').addEventListener('input', () => { $('search').classList.toggle('has-q', !!$('q').value); suggest(); });
$('q').addEventListener('keydown', e => {
  if(e.isComposing) return;   // let Japanese / Thai IME finish composing first
  if(e.key === 'Enter'){ const li = $('suggest').querySelector('li[data-place]'); if(li) selectPlace(li.dataset.place); $('q').blur(); }
  if(e.key === 'Escape'){ closeMenus(); $('q').blur(); }
});
$('clear').addEventListener('click', e => { e.preventDefault(); clearPlace(); });
$('suggest').addEventListener('mousedown', e => { const li = e.target.closest('li[data-place]'); if(li){ e.preventDefault(); burst(li, {word:'ドン!', size:.8}); selectPlace(li.dataset.place); $('q').blur(); } });
$('lang').addEventListener('change', e => { burst(e.target.closest('.sel'), {word:'ペラッ', size:.6}); setLang(e.target.value); });
$('panel').addEventListener('change', e => { if(e.target.id === 'origin'){ burst(e.target.closest('.sel'), {word:'パッ', size:.6}); setOrigin(e.target.value); } });
$('panel').addEventListener('click', e => {
  const cat = e.target.closest('[data-cat]'), pl = e.target.closest('[data-place]'), rt = e.target.closest('[data-route]');
  const shot = e.target.closest('[data-shot]'), back = e.target.closest('[data-back]');
  if(shot){ burst(shot, {word:'パシャ', size:.6}); openViewer(shot.dataset.shot, +shot.dataset.i, shot.closest('.step').querySelector('.hd').textContent); }
  else if(cat){ if(cat.dataset.cat !== state.cat){ burst(cat, {size:.4}); state.cat = cat.dataset.cat; syncMarkers(); renderPanel(); fitAll(); } }
  else if(pl){ burst(pl, {word:'ドン!'}); selectPlace(pl.dataset.place); }
  else if(rt){ if(+rt.dataset.route !== state.route) burst(rt, {word:'シュッ', size:.75});
    state.route = +rt.dataset.route; const top = $('pbody').scrollTop; renderPanel(); $('pbody').scrollTop = top; drawRoute(); }
  else if(back){ burst(back, {size:.4}); clearPlace(); }
  else if(isMobile() && e.target.closest('.grab')) setSheet(SHEET.snap === 'half' ? 'full' : 'half');
});
document.addEventListener('mousedown', e => { if(!e.target.closest('#search')) closeMenus(); });

// sheet dragging
let drag = null, justDragged = false;
$('panel').addEventListener('pointerdown', e => {
  if(!isMobile() || !e.target.closest('.grab, .shead') || e.target.closest('select')) return;
  drag = {id:e.pointerId, y:e.clientY, h:sheetPx(SHEET.snap), t:performance.now(), moved:false};
});
addEventListener('pointermove', e => {
  if(!drag || e.pointerId !== drag.id) return;
  const dy = drag.y - e.clientY;
  if(!drag.moved){ if(Math.abs(dy) < 6) return; drag.moved = true; $('panel').classList.add('dragging'); }
  applySheet(Math.max(120, Math.min(innerHeight - 60, drag.h + dy)));
});
function endDrag(e, cancel){
  if(!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  $('panel').classList.remove('dragging');
  if(!d.moved) return;
  justDragged = true; setTimeout(() => justDragged = false, 0);
  if(cancel) return setSheet(SHEET.snap);
  const dy = d.y - e.clientY, h = d.h + dy, v = dy / Math.max(1, performance.now() - d.t);   // v > 0 = flicked up
  const snaps = ['peek','half','full'].map(s => [s, sheetPx(s)]);
  let s = snaps.reduce((a,b) => Math.abs(b[1]-h) < Math.abs(a[1]-h) ? b : a)[0];
  if(v > .5) s = (snaps.find(([,px]) => px > h + 8) || snaps[2])[0];
  if(v < -.5) s = ([...snaps].reverse().find(([,px]) => px < h - 8) || snaps[0])[0];
  setSheet(s);
}
addEventListener('pointerup', e => endDrag(e));
addEventListener('pointercancel', e => endDrag(e, true));
$('panel').addEventListener('click', e => { if(justDragged){ e.stopPropagation(); e.preventDefault(); } }, true);
addEventListener('resize', () => applySheet(sheetPx(SHEET.snap)));

setSheet('half');
renderAll(); fitAll();
</script>
</body>
</html>
